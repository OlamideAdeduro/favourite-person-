
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favourite Person</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style-3.css">
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Favourite Person</a>
        </div>
    </nav>

    <!-- Main profile section -->
    <main class="container py-5">
        <h1 class="text-center mb-4">My Favourite Person Profile</h1>

        <div class="card profile-card mx-auto shadow">
            <img
                src=tems.jpg
                class="card-img-top"
                alt="Tems">

            <div class="card-body text-center">
                <h2 id="personName" class="card-title"></h2>

                <p id="occupation" class="text-muted"></p>

                <p id="biography" class="card-text"></p>

                <div class="row text-start mt-4">
                    <div class="col-md-6">
                        <p><strong>Nationality:</strong>
                            <span id="nationality"></span>
                        </p>
                    </div>

                    <div class="col-md-6">
                        <p><strong>Born:</strong>
                            <span id="birthYear"></span>
                        </p>
                    </div>
                </div>

                <button
                    class="btn btn-primary"
                    onclick="showFact()">
                    Show an Interesting Fact
                </button>

                <p id="fact" class="mt-3 fw-bold"></p>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">Created by Olamide | Web Development Project</p>
    </footer>

    <script src="script-3.js"></script>
</body>
</html>
